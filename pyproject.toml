[project]
name = "nii2-shg-demo"
version = "0.1.0"
description = "Explicit optical-response circuits for a NiI2-motivated toy model"
readme = "README.md"
authors = [
    { name = "MagfluxP", email = "xypeng@utexas.edu" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "numpy>=2.5.4",
    "pylatexenc>=2.10",
    "qiskit>=2.6.2",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nii2_shg"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
